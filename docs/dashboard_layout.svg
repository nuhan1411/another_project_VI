    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102a43" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
